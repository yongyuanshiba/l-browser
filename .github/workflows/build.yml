name: Build baseline APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages (platform 37, build-tools 37.0.0)
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" || sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Build release APK
        # The repo's release build type is signed with the debug signing config
        # (see app/build.gradle releaseTemplate), so no secrets are needed.
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: l-browser-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
